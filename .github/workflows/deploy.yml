name: Deploy Portfolio

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Deploy commit message"
        required: true
        default: "Deploy website"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npm run deploy -- -m "${{ inputs.message }}"
